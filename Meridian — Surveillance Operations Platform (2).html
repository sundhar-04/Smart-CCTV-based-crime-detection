<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian — Surveillance Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --void: #05070A;
    --panel: #0B0E14;
    --panel-raised: #10141C;
    --panel-hover: #151B25;
    --border: #1D242F;
    --border-soft: #161C25;
    --text-hi: #E7ECF4;
    --text-mid: #9AA5B6;
    --text-low: #626D80;
    --accent: #4C9EFF;
    --accent-dim: #1B3A5C;
    --critical: #E5484D;
    --critical-dim: rgba(229,72,77,0.14);
    --high: #F0883E;
    --high-dim: rgba(240,136,62,0.14);
    --medium: #E6C560;
    --medium-dim: rgba(230,197,96,0.14);
    --safe: #3DD68C;
    --safe-dim: rgba(61,214,140,0.14);
    --info: #4C9EFF;
    --info-dim: rgba(76,158,255,0.14);
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --radius-sharp: 3px;
    --radius-soft: 8px;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--text-hi);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #root { height: 100%; }
  ::selection { background: var(--accent-dim); color: var(--text-hi); }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #232B38; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2C3646; }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .app-shell { display: flex; height: 100%; background:
    radial-gradient(ellipse 1200px 800px at 15% -10%, rgba(76,158,255,0.05), transparent 60%),
    radial-gradient(ellipse 900px 700px at 100% 110%, rgba(61,214,140,0.03), transparent 60%),
    var(--void);
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    transition: width .22s cubic-bezier(.4,0,.2,1);
  }
  .sidebar.collapsed { width: 64px; }
  .sidebar-brand {
    height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(155deg, #4C9EFF, #1B3A5C 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(76,158,255,0.25), 0 4px 12px rgba(76,158,255,0.18);
  }
  .brand-name { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
  .brand-sub { font-size: 10px; color: var(--text-low); white-space: nowrap; overflow: hidden; margin-top: -1px; }

  .nav-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .nav-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-low);
    padding: 12px 10px 6px; white-space: nowrap; overflow: hidden;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 8px 10px; margin: 1px 0;
    border-radius: var(--radius-soft); color: var(--text-mid); cursor: pointer;
    border: 1px solid transparent; position: relative; white-space: nowrap; overflow: hidden;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item:hover { background: var(--panel-hover); color: var(--text-hi); }
  .nav-item.active { background: var(--panel-hover); color: var(--text-hi); border-color: var(--border); }
  .nav-item.active::before {
    content: ''; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .nav-item svg { flex-shrink: 0; }
  .nav-item-label { font-size: 12.5px; font-weight: 500; }
  .nav-item-badge {
    margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 10px; background: var(--critical-dim); color: var(--critical);
  }
  .sidebar-footer { padding: 10px; border-top: 1px solid var(--border-soft); }
  .sys-status-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--safe); flex-shrink: 0; position: relative; }
  .pulse-dot::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%; background: var(--safe);
    opacity: .5; animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing { 0% { transform: scale(0.6); opacity: .55; } 100% { transform: scale(2.2); opacity: 0; } }

  /* ---------- Topbar ---------- */
  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar {
    height: 56px; flex-shrink: 0; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; padding: 0 18px; gap: 14px; background: rgba(11,14,20,0.7);
    backdrop-filter: blur(10px);
  }
  .icon-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-soft); border: 1px solid var(--border); background: var(--panel-raised);
    color: var(--text-mid); cursor: pointer; flex-shrink: 0; position: relative;
    transition: color .12s, border-color .12s, background .12s;
  }
  .icon-btn:hover { color: var(--text-hi); border-color: #2A3441; background: var(--panel-hover); }
  .search-bar {
    flex: 1; max-width: 480px; height: 34px; border: 1px solid var(--border); background: var(--panel-raised);
    border-radius: var(--radius-soft); display: flex; align-items: center; gap: 8px; padding: 0 10px;
    color: var(--text-low); cursor: pointer; transition: border-color .12s;
  }
  .search-bar:hover { border-color: #2A3441; }
  .search-bar span.kbd {
    margin-left: auto; font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 4px; color: var(--text-low);
  }
  .topbar-spacer { flex: 1; }
  .mode-chip {
    display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--safe-dim); background: var(--safe-dim); color: var(--safe);
    font-size: 11px; font-weight: 600; font-family: var(--font-mono); white-space: nowrap;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: var(--radius-soft); background: linear-gradient(155deg,#2A3441,#151A22);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--text-mid); cursor: pointer;
  }
  .notif-dot {
    position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--critical); box-shadow: 0 0 0 2px var(--panel-raised);
  }

  .page-scroll { flex: 1; overflow-y: auto; padding: 20px 22px 40px; }
  .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
  .page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .page-sub { color: var(--text-mid); font-size: 12.5px; margin-top: 3px; }
  .page-actions { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--radius-soft);
    border: 1px solid var(--border); background: var(--panel-raised); color: var(--text-hi); font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all .12s ease; white-space: nowrap;
  }
  .btn:hover { border-color: #2A3441; background: var(--panel-hover); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #051220; }
  .btn.primary:hover { background: #6BADFF; }
  .btn.danger { background: var(--critical-dim); border-color: rgba(229,72,77,0.3); color: var(--critical); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 11px; }

  .panel {
    background: var(--panel-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-soft);
  }
  .panel-title-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; border-bottom: 1px solid var(--border-soft); }
  .panel-title { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-mid); }
  .panel-title b { color: var(--text-hi); }
  .panel-body { padding: 15px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi-card {
    background: var(--panel-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-soft);
    padding: 13px 14px; position: relative; overflow: hidden;
  }
  .kpi-label { font-size: 10.5px; color: var(--text-low); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .kpi-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
  .kpi-delta { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .kpi-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono); letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .badge.critical { background: var(--critical-dim); color: var(--critical); }
  .badge.high { background: var(--high-dim); color: var(--high); }
  .badge.medium { background: var(--medium-dim); color: var(--medium); }
  .badge.low, .badge.safe { background: var(--safe-dim); color: var(--safe); }
  .badge.info { background: var(--info-dim); color: var(--info); }
  .badge.neutral { background: var(--panel-hover); color: var(--text-mid); }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.critical { background: var(--critical); box-shadow: 0 0 8px rgba(229,72,77,0.7); }
  .dot.high { background: var(--high); }
  .dot.medium { background: var(--medium); }
  .dot.safe { background: var(--safe); }
  .dot.offline { background: #4A5568; }
  .dot.info { background: var(--info); }

  .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }
  .grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 1100px) { .grid-2col { grid-template-columns: 1fr; } }

  .list-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background .1s;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: var(--panel-hover); }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .scan-line {
    position: absolute; left: 0; right: 0; height: 40%; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(76,158,255,0.05), transparent);
    animation: scan 4s linear infinite;
  }
  @keyframes scan { 0% { top: -40%; } 100% { top: 100%; } }

  .progress-track { height: 5px; background: var(--panel-hover); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7CC6FF); border-radius: 3px; transition: width .2s linear; }

  .conf-bar-track { height: 4px; width: 100%; background: var(--panel-hover); border-radius: 2px; overflow: hidden; }
  .conf-bar-fill { height: 100%; border-radius: 2px; }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(2,3,6,0.55); backdrop-filter: blur(2px);
    z-index: 40; animation: fadeIn .18s ease;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 92vw; background: var(--panel);
    border-left: 1px solid var(--border); z-index: 41; display: flex; flex-direction: column;
    animation: slideIn .22s cubic-bezier(.16,1,.3,1);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

  .cmdk-backdrop {
    position: fixed; inset: 0; background: rgba(2,3,6,0.6); backdrop-filter: blur(3px); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; animation: fadeIn .15s ease;
  }
  .cmdk-box {
    width: 560px; max-width: 92vw; background: var(--panel-raised); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); overflow: hidden;
    animation: slideDown .18s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideDown { from { opacity:0; transform: translateY(-8px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(2,3,6,0.65); z-index: 45; display: flex;
    align-items: center; justify-content: center; padding: 20px; animation: fadeIn .16s ease;
  }
  .investigation-modal {
    width: 1180px; max-width: 100%; height: 84vh; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    animation: slideDown .2s cubic-bezier(.16,1,.3,1);
  }

  .toast-stack { position: fixed; bottom: 18px; right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast {
    background: var(--panel-raised); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 13px; width: 300px; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    animation: toastIn .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  .tabs-row { display: flex; gap: 2px; border-bottom: 1px solid var(--border-soft); }
  .tab-btn {
    padding: 9px 14px; font-size: 12px; font-weight: 600; color: var(--text-mid); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-hi); }
  .tab-btn.active { color: var(--text-hi); border-color: var(--accent); }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table th {
    text-align: left; font-size: 10.5px; font-weight: 700; color: var(--text-low); text-transform: uppercase;
    letter-spacing: 0.04em; padding: 9px 10px; border-bottom: 1px solid var(--border-soft); white-space: nowrap;
  }
  table.data-table td { padding: 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  table.data-table tbody tr { cursor: pointer; transition: background .1s; }
  table.data-table tbody tr:hover { background: var(--panel-hover); }

  input.field, select.field {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-hi); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; outline: none; transition: border-color .12s;
  }
  input.field:focus, select.field:focus { border-color: var(--accent); }
  input.field::placeholder { color: var(--text-low); }

  .checker-noise {
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 2px);
  }

  .cam-tile { position: relative; border-radius: 7px; overflow: hidden; border: 1px solid var(--border-soft); background: #000; }
  .cam-tile:hover { border-color: #2A3441; }
  .cam-tile-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 7px 8px; display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, rgba(0,0,0,0.75), transparent); z-index: 2; }
  .cam-tile-botbar { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent); z-index: 2; }

  .marker-pin {
    width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(5,7,10,0.9); cursor: pointer;
    transition: transform .15s ease;
  }
  .marker-pin:hover { transform: scale(1.35); }

  .kbd-key { font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--border); background: var(--panel-hover); padding: 1px 6px; border-radius: 4px; color: var(--text-mid); }

  .risk-section-head { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
  .risk-section-head:first-child { margin-top: 0; }
  .risk-line { flex: 1; height: 1px; background: var(--border-soft); }

  .expand-caret { transition: transform .18s ease; }
  .expand-caret.open { transform: rotate(90deg); }

  .thumb {
    width: 100%; height: 100%; border-radius: 5px; position: relative; overflow: hidden;
  }

  ::backdrop { background: transparent; }
  .scroll-thin { scrollbar-width: thin; }

  input[type="range"] { accent-color: var(--accent); width: 100%; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; cursor: pointer; inset: 0; background: var(--panel-hover); border: 1px solid var(--border);
    border-radius: 999px; transition: background .15s;
  }
  .switch-track::before {
    content: ""; position: absolute; height: 13px; width: 13px; left: 2px; top: 2px; background: var(--text-low);
    border-radius: 50%; transition: transform .15s, background .15s;
  }
  .switch input:checked + .switch-track { background: var(--info-dim); border-color: rgba(76,158,255,0.4); }
  .switch input:checked + .switch-track::before { transform: translateX(15px); background: var(--accent); }

  .banner {
    display: flex; align-items: center; gap: 10px; padding: 8px 18px; font-size: 12px; font-weight: 600;
    border-bottom: 1px solid var(--border-soft); flex-shrink: 0;
  }
  .banner.warn { background: var(--medium-dim); color: var(--medium); }
  .banner.critical { background: var(--critical-dim); color: var(--critical); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-family: var(--font-mono);
    padding: 3px 8px; border-radius: 5px; background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-mid);
  }
  .role-select {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text-hi); border-radius: var(--radius-soft);
    padding: 6px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; outline: none;
  }
  .decision-panel { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; padding: 14px; margin-top: 10px; }

  @media (max-width: 880px) {
    .sidebar { position: fixed; z-index: 55; height: 100%; }
    .sidebar:not(.mobile-open) { display: none; }
    .grid-2col, .grid-3col { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.__MERIDIAN_APP__ = true;
</script>
<script>

const LOCATIONS = [

  { name: "North Warehouse Row", zone: "Industrial Belt", lat: 40.718, lng: -74.018 },
  { name: "Silver Creek Overpass", zone: "Industrial Belt", lat: 40.721, lng: -74.021 },
  { name: "Founders Plaza", zone: "Downtown", lat: 40.710, lng: -74.004 },
  { name: "Ashcombe Retail Strip", zone: "Midtown", lat: 40.715, lng: -73.996 },

function seededRandom(seed) {

    return (s - 1) / 2147483646;
  };
}

// ===================== RISK ENGINE MODEL =====================
// Mirrors the SmartCCTV SDD: weak signals accumulate per entity, an alert
// requires >= min_groups independent signal groups (or a "strong" override),
// and is subject to a per-camera hourly budget before it reaches an operator.

const SIGNAL_TYPES = [
  { key: "ZONE_ENTER", group: "zone", label: "Zone Enter", baseWeight: 35 },
  { key: "ZONE_DWELL", group: "zone", label: "Zone Dwell", baseWeight: 10 },
  { key: "LOITER", group: "loiter", label: "Loiter", baseWeight: 15 },
  { key: "RUNNING", group: "motion", label: "Running", baseWeight: 10 },
  { key: "UNATTENDED", group: "object", label: "Unattended Object", baseWeight: 45 },
  { key: "GAP_DWELL", group: "gap", label: "Cross-Camera Gap Dwell", baseWeight: 20 },
];

const INCIDENT_TO_SIGNALS = {
  weapon: ["ZONE_ENTER", "RUNNING"],
  assault: ["RUNNING", "ZONE_DWELL"],
  intrusion: ["ZONE_ENTER"],
  restricted: ["ZONE_ENTER", "ZONE_DWELL"],
  theft: ["UNATTENDED", "LOITER"],
  crowd: ["ZONE_DWELL", "LOITER"],
  vehicle: ["ZONE_ENTER"],
  abandoned: ["UNATTENDED"],
  loitering: ["LOITER"],
  smoke: ["ZONE_DWELL"],
  tailgating: ["ZONE_ENTER", "GAP_DWELL"],
  perimeter: ["ZONE_ENTER", "GAP_DWELL"],
};

const RISK_ENGINE_DEFAULTS = {
  thr: 60, tau: 30, alert_budget_per_hour: 6, cooldown: 60, min_groups: 2, div_bonus: 0.4,
  loiter_s: 10, loiter_frac: 0.5, run_hps: 1.5, dwell_s: 5, stat_s: 8, away_s: 8, emit_gap: 2, night_mult: 1.5,
};

function deriveSignals(incident) {
  const keys = INCIDENT_TO_SIGNALS[incident.type] || ["ZONE_ENTER"];
  const targetTotal = Math.max(30, incident.riskScore * 1.15);
  const perSignal = targetTotal / keys.length;
  return keys.map((k) => {
    const def = SIGNAL_TYPES.find((s) => s.key === k);
    const count = Math.max(1, Math.round(perSignal / def.baseWeight));
    const multiplier = +(rand(1.0, 1.4)).toFixed(2);
    const weight = Math.round(def.baseWeight * count * multiplier);
    return { type: k, group: def.group, label: def.label, count, baseWeight: def.baseWeight, multiplier, weight };
  });
}

const DISMISS_REASONS = ["Normal activity", "Staff or authorized", "Known object", "Camera or lighting issue", "Duplicate", "Other"];

// Enrich the ALERTS queue with the SDD's lifecycle, budget accounting, signals and dispatch.
(function enrichAlertsWithRiskEngine() {
  const perCameraHourCounter = {};
  ALERTS.sort((a, b) => a.timestamp - b.timestamp); // process chronologically for budget accounting
  ALERTS.forEach((a, idx) => {
    const signals = deriveSignals({ type: incidentTypeOf(a), riskScore: Math.round((a.confidence / 100) * 99) });
    const groups = new Set(signals.map((s) => s.group));
    const totalWeight = signals.reduce((s, x) => s + x.weight, 0);
    const severity = +(totalWeight / RISK_ENGINE_DEFAULTS.thr).toFixed(2);
    const strong = severity >= 2.0 || groups.has("object");

    const bucketKey = a.camera + "-" + a.timestamp.toDateString() + "-" + a.timestamp.getHours();
    perCameraHourCounter[bucketKey] = (perCameraHourCounter[bucketKey] || 0) + 1;
    const withinBudget = perCameraHourCounter[bucketKey] <= RISK_ENGINE_DEFAULTS.alert_budget_per_hour;
    const budgetOverride = severity >= 2.5;

    const ageDays = Math.floor((Date.now() - a.timestamp) / 86400000);
    const ageMins = Math.floor((Date.now() - a.timestamp) / 60000);

    let status;
    let dismissReason = null;
    let dispatch = null;
    if (!withinBudget && !budgetOverride) {
      status = "SUPPRESSED_BY_BUDGET";
    } else if (ageMins < 12) {
      status = "PENDING_CONFIRMATION";
    } else if (ageDays >= 2 && rng() < 0.08) {
      status = "EXPIRED";
    } else {
      const roll = rng();
      if (roll < 0.62) {
        status = "CONFIRMED";
        dispatch = {
          channels: ["telegram", "webhook"].filter(() => rng() > 0.15),
          status: "delivered",
          sentAt: new Date(a.timestamp.getTime() + randInt(20, 180) * 1000),
        };
        if (dispatch.channels.length === 0) dispatch.channels = ["telegram"];
      } else {
        status = "DISMISSED";
        dismissReason = pick(DISMISS_REASONS);
      }
    }

    a.signals = signals;
    a.severity = severity;
    a.strong = strong;
    a.groups = [...groups];
    a.status = status;
    a.dismissReason = dismissReason;
    a.dispatch = dispatch;
    a.acknowledged = status !== "PENDING_CONFIRMATION" && status !== "SUPPRESSED_BY_BUDGET";
    a.budgetIndex = perCameraHourCounter[bucketKey];
    a.globalId = null;
  });
  ALERTS.sort((a, b) => b.timestamp - a.timestamp);

  // Guarantee a few budget-suppressed alerts exist so the Digest view has content to demo,
  // even when simulated volume is too low to naturally exceed the hourly cap.
  const suppressedCount = ALERTS.filter((a) => a.status === "SUPPRESSED_BY_BUDGET").length;
  if (suppressedCount < 3) {
    const candidates = ALERTS.filter((a) => a.status === "DISMISSED" || a.status === "CONFIRMED")
      .sort((a, b) => a.severity - b.severity)
      .slice(0, 3 - suppressedCount);
    candidates.forEach((a) => {
      a.status = "SUPPRESSED_BY_BUDGET";
      a.dismissReason = null;
      a.dispatch = null;
      a.acknowledged = false;
    });
  }

  // Simulate a handful of cross-camera identity links (blind-spot re-linking).
  let gidSeq = 1;
  for (let i = 0; i + 1 < ALERTS.length; i += 7) {
    const gid = "G" + gidSeq++;
    ALERTS[i].globalId = gid;
    ALERTS[i + 1].globalId = gid;
  }
})();

}

// ===================== CAMERA TOPOLOGY (blind-spot linking) =====================
function dist(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2); }
const TOPOLOGY_EDGES = [];
CAMERAS.forEach((c, i) => {
  const others = CAMERAS.map((o, j) => ({ o, j, d: dist(c, o) })).filter((e) => e.j !== i).sort((a, b) => a.d - b.d).slice(0, 2);
  others.forEach((e) => {
    const already = TOPOLOGY_EDGES.some((edge) => (edge.from === c.id && edge.to === e.o.id) || (edge.from === e.o.id && edge.to === c.id));
    if (already) return;
    const meanS = Math.max(4, Math.round(e.d * 2.2));
    TOPOLOGY_EDGES.push({ from: c.id, to: e.o.id, meanS, stdS: Math.round(meanS * 0.28), source: rng() > 0.6 ? "learned" : "manual", samples: randInt(8, 240) });
  });
});

// ---------- Network visualization (pseudo-3D canvas, no three.js dependency) ----------
function NetworkGraph({ nodes, height }) {
  const canvasRef = useRef(null);
  const rotRef = useRef(0);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf;
    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    const statusColor = { online: "#3DD68C", offline: "#4A5568", alert: "#E5484D", maintenance: "#E6C560" };

    function project(x, y, z) {
      const persp = 620 / (620 + z);
      return { x: w / 2 + x * persp, y: h / 2 + y * persp, scale: persp };
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      rotRef.current += 0.0022;
      const rot = rotRef.current;
      const cx = w / 2, cy = h / 2;
      const baseR = Math.min(w, h) * 0.34;

      const pts = nodes.map((n) => {
        const a = n.angle + rot * (n.speed > 0 ? 1 : -1) * 1;
        const r = baseR * n.radiusJitter;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r * 0.55;
        const y = n.heightJitter * baseR * 0.5 + Math.sin(rot * 2 + n.angle) * 6;
        return { ...n, x, y, z, proj: project(x, y, z) };
      });

      // core sphere glow
      const coreGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, baseR * 0.5);
      coreGrad.addColorStop(0, "rgba(76,158,255,0.16)");
      coreGrad.addColorStop(1, "rgba(76,158,255,0)");
      ctx.fillStyle = coreGrad;
      ctx.beginPath(); ctx.arc(cx, cy, baseR * 0.55, 0, Math.PI * 2); ctx.fill();

      // orbit rings
      ctx.strokeStyle = "rgba(76,158,255,0.10)";
      ctx.lineWidth = 1;
      [0.55, 0.78, 1.0].forEach((f) => {
        ctx.beginPath();
        ctx.ellipse(cx, cy, baseR * f, baseR * f * 0.4, 0, 0, Math.PI * 2);
        ctx.stroke();
      });

      // connections (sorted back to front)
      const sorted = [...pts].sort((a, b) => a.z - b.z);
      ctx.lineWidth = 1;
      for (let i = 0; i < sorted.length; i++) {
        const n = sorted[i];
        const next = sorted[(i + 3) % sorted.length];
        const op = 0.05 + (n.proj.scale - 0.7) * 0.25;
        ctx.strokeStyle = `rgba(76,158,255,${Math.max(0.02, Math.min(0.16, op))})`;
        ctx.beginPath();
        ctx.moveTo(n.proj.x, n.proj.y);
        ctx.lineTo(cx, cy);
        ctx.stroke();
      }

      // node points
      sorted.forEach((n) => {
        const r = 2.6 * n.proj.scale;
        const col = statusColor[n.status] || "#4C9EFF";
        ctx.globalAlpha = Math.max(0.35, n.proj.scale);
        if (n.status === "alert") {
          const pulse = (Math.sin(Date.now() / 260 + n.angle * 4) + 1) / 2;
          ctx.beginPath();
          ctx.fillStyle = `rgba(229,72,77,${0.12 + pulse * 0.18})`;
          ctx.arc(n.proj.x, n.proj.y, r * 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath();
        ctx.fillStyle = col;
        ctx.arc(n.proj.x, n.proj.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });

      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [nodes]);

  return html`<canvas ref=${canvasRef} style=${{ width: "100%", height: height || "100%", display: "block" }}></canvas>`;
}

// ---------- Sparkline (tiny canvas trend, used in KPI cards) ----------
function Sparkline({ data, color }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = 34;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = Math.max(max - min, 1);
    const step = w / (data.length - 1);
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = i * step;
      const y = h - ((v - min) / range) * (h - 4) - 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color || "#4C9EFF";
    ctx.lineWidth = 1.6;
    ctx.stroke();
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, (color || "#4C9EFF") + "33");
    grad.addColorStop(1, (color || "#4C9EFF") + "00");
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }, [data]);
  return html`<canvas ref=${ref} style=${{ width: "100%", height: "34px", display: "block" }}></canvas>`;
}

// ---------- Chart.js wrapper ----------
function ChartCanvas({ type, data, options, height }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), {
      type, data, options: Object.assign({
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
      }, options || {}),
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, []);
  return html`<div style=${{ height: height || "220px", position: "relative" }}><canvas ref=${canvasRef}></canvas></div>`;
}

function SystemBanner({ tamperEvents, offlineCount }) {

  const critical = activeTamper.length > 0;
  return html`
    <div className=${"banner " + (critical ? "critical" : "warn")}>
      ${ICN.alert({ size: 14 })}
      ${activeTamper.length > 0 && html`
        <span>${activeTamper.length} camera${activeTamper.length > 1 ? "s" : ""} reporting a tamper condition (${activeTamper.map((t) => t.camera + " " + t.kind).join(", ")}) — check the affected view.</span>
      `}
      ${activeTamper.length > 0 && offlineCount > 0 && html`<span style=${{ opacity: 0.5 }}>·</span>`}
      ${offlineCount > 0 && html`<span>${offlineCount} camera${offlineCount > 1 ? "s" : ""} offline — coverage gap.</span>`}

}

  const suggestions = useMemo(() => {
    const query = q.trim().toLowerCase();

      { icon: ICN.alert, label: "Show high-risk incidents today", action: () => onNavigate("incidents") },

const ANALYSIS_STAGES = ["Upload", "Preview", "Frame Processing", "Detection", "Risk Classification", "Report"];

function VideoAnalysisPage({ pushToast, pushNotification, onOpenIncident, registerIncidents }) {
  const [file, setFile] = useState(null);
  const [videoUrl, setVideoUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [status, setStatus] = useState("idle"); // idle | ready | analyzing | paused | complete
  const [currentFrame, setCurrentFrame] = useState(0);
  const [totalFrames, setTotalFrames] = useState(5400);
  const [detections, setDetections] = useState([]);
  const [liveConfidence, setLiveConfidence] = useState(0);
  const [box, setBox] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const videoRef = useRef(null);
  const intervalRef = useRef(null);
  const FPS = 30;

  const stageIndex = status === "idle" ? 0 : status === "ready" ? 1 : (status === "analyzing" || status === "paused") ? 2 : 5;

  function loadFile(f) {
    if (!f) return;
    setFile(f);
    const url = URL.createObjectURL(f);
    setVideoUrl(url);
    setStatus("ready");
    setDetections([]);
    setCurrentFrame(0);
    setLiveConfidence(0);
  }

  function onVideoMeta() {
    const d = videoRef.current ? videoRef.current.duration : 180;
    setDuration(d);
    setTotalFrames(Math.max(300, Math.round(d * FPS)));
  }

  function spawnDetection(frameNum) {
    const type = pick(INCIDENT_TYPES);
    const confidence = Math.round(rand(58, 98));
    const ts = frameNum / FPS;
    let score = confidence * 0.55 + (type.base === "critical" ? 32 : type.base === "high" ? 20 : type.base === "medium" ? 9 : 2);
    score = Math.min(99, Math.round(score));
    const det = {
      id: "DET-" + pad(frameNum, 5) + "-" + Date.now().toString(36).slice(-4),
      type: type.key,
      label: type.label,
      explanation: EXPLANATIONS[type.key],
      confidence,
      riskScore: score,
      risk: riskFromScore(score),
      videoTime: ts,
      frame: frameNum,
      camera: "UPLOAD-01",
      cameraName: file ? file.name : "Uploaded Footage",
      zone: "Uploaded Source",
      timestamp: new Date(Date.now() - (duration - ts) * 1000),
      status: "New",
      peopleInvolved: randInt(1, 5),
    };
    setDetections((prev) => [det, ...prev]);
    setBox({ x: rand(10, 65), y: rand(15, 60), w: rand(14, 26), h: rand(20, 40), risk: det.risk });
    setTimeout(() => setBox(null), 1100);
    pushToast({ id: det.id, title: det.label, sub: `Frame ${frameNum} · ${confidence}% confidence`, risk: det.risk, timestamp: new Date() });
  }

  useEffect(() => {
    if (status !== "analyzing") return;
    intervalRef.current = setInterval(() => {
      setCurrentFrame((f) => {
        const step = randInt(14, 34);
        const next = Math.min(totalFrames, f + step);
        if (rng() < 0.16 && next < totalFrames) spawnDetection(next);
        if (next >= totalFrames) {
          clearInterval(intervalRef.current);
          setStatus("complete");
          pushNotification({ kind: "complete", title: "Analysis complete", sub: (file ? file.name : "Footage") + " — full report ready" });
        }
        return next;
      });
      setLiveConfidence(Math.round(rand(64, 97)));
    }, 160);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line
  }, [status, totalFrames, duration]);

  useEffect(() => {
    if (detections.length > 0) registerIncidents(detections);
    // eslint-disable-next-line
  }, [detections.length]);

  function handleAnalyze() {
    setStatus("analyzing");
    if (videoRef.current) videoRef.current.play().catch(() => {});
  }
  function handlePause() {
    setStatus("paused");
    if (videoRef.current) videoRef.current.pause();
  }
  function handleResume() {
    setStatus("analyzing");
    if (videoRef.current) videoRef.current.play().catch(() => {});
  }
  function handleStop() {
    setStatus("ready");
    setCurrentFrame(0);
    setDetections([]);
    if (videoRef.current) { videoRef.current.pause(); videoRef.current.currentTime = 0; }
  }
  function handleRestart() {
    setDetections([]);
    setCurrentFrame(0);
    setStatus("analyzing");
    if (videoRef.current) { videoRef.current.currentTime = 0; videoRef.current.play().catch(() => {}); }
  }

  const pct = totalFrames ? Math.min(100, Math.round((currentFrame / totalFrames) * 100)) : 0;
  const remaining = Math.max(0, totalFrames - currentFrame);

  const grouped = { critical: [], high: [], medium: [], low: [] };
  detections.forEach((d) => grouped[d.risk].push(d));

  return html`
    <div className="fade-in">
      <div className="page-header">
        <div>
          <div className="page-title">Video Analysis</div>
          <div className="page-sub">Upload footage to run frame-by-frame detection and risk classification</div>
        </div>
      </div>

      <div style=${{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        ${ANALYSIS_STAGES.map((s, i) => html`
          <div key=${s} style=${{
            display: "flex", alignItems: "center", gap: 7, padding: "6px 12px", borderRadius: 999,
            border: "1px solid " + (i <= stageIndex ? "rgba(76,158,255,0.35)" : "var(--border-soft)"),
            background: i <= stageIndex ? "var(--info-dim)" : "var(--panel-raised)",
            color: i <= stageIndex ? "var(--accent)" : "var(--text-low)", fontSize: 11, fontWeight: 600,
          }}>
            <span className="mono">${pad(i + 1, 2)}</span> ${s}
          </div>
        `)}
      </div>

      <div className="grid-2col">
        <div className="panel" style=${{ overflow: "hidden" }}>
          <div className="panel-title-row">
            <div className="panel-title">Evidence Preview</div>
            ${file && html`<span className="badge neutral">${file.name}</span>`}
          </div>
          <div className="panel-body">
            ${!videoUrl && html`
              <div
                onDragOver=${(e) => { e.preventDefault(); setDragOver(true); }}
                onDragLeave=${() => setDragOver(false)}
                onDrop=${(e) => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) loadFile(f); }}
                style=${{
                  border: "1.5px dashed " + (dragOver ? "var(--accent)" : "var(--border)"), borderRadius: 8,
                  height: 340, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                  gap: 10, background: dragOver ? "var(--info-dim)" : "transparent", transition: "all .15s",

function EvidenceCanvas({ hue, risk, playing }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let raf;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + "px"; canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    let t = 0;
    function draw() {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      t += playing ? 0.01 : 0.002;
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, `hsl(${hue} 35% ${8 + Math.sin(t) * 2}%)`);
      g.addColorStop(1, `hsl(${(hue + 30) % 360} 30% 5%)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      for (let i = 0; i < w; i += 28) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
      for (let i = 0; i < h; i += 28) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
      const bx = w * (0.3 + 0.25 * Math.sin(t * 0.7));
      const by = h * (0.35 + 0.15 * Math.cos(t * 0.5));
      const bw = w * 0.16, bh = h * 0.3;
      ctx.strokeStyle = RISK_HEX[risk] || "#4C9EFF";
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.font = "10px monospace";
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText("TRACK_01", bx, by - 6);
      raf = requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener("resize", resize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [hue, risk, playing]);
  return html`<canvas ref=${ref} style=${{ width: "100%", height: "100%", display: "block" }}></canvas>`;
}

function riskTimelineData(incident) {
  const thr = RISK_ENGINE_DEFAULTS.thr;
  const peak = incident.riskScore ? incident.riskScore * 1.15 : thr * 1.6;
  const labels = []; const scores = []; const threshold = [];
  for (let t = -20; t <= 15; t += 2.5) {
    labels.push((t > 0 ? "+" : "") + t + "s");
    const rise = 1 / (1 + Math.exp(-(t + 3) / 3));
    const decay = t > 0 ? Math.exp(-t / 14) : 1;
    scores.push(Math.round(peak * rise * decay));
    threshold.push(thr);
  }
  return { labels, scores, threshold };
}

function LiveFeedCanvas({ hue, status }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let raf, t = 0;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + "px"; canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    function draw() {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      if (status === "offline") {
        ctx.fillStyle = "#050607";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.fillText("SIGNAL LOST", w / 2, h / 2);
        ctx.textAlign = "left";
      } else {
        t += 0.01;
        const g = ctx.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, `hsl(${hue} 30% ${10 + Math.sin(t) * 2}%)`);
        g.addColorStop(1, `hsl(${(hue + 25) % 360} 25% 5%)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(255,255,255,0.035)";
        for (let i = 0; i < w; i += 24) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
        const bx = w * (0.35 + 0.2 * Math.sin(t * 0.6));
        const by = h * (0.4 + 0.12 * Math.cos(t * 0.4));
        ctx.strokeStyle = "rgba(76,158,255,0.6)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx, by, w * 0.12, h * 0.28);
      }
      raf = requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener("resize", resize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [hue, status]);
  return html`<canvas ref=${ref} style=${{ width: "100%", height: "100%", display: "block" }}></canvas>`;
}

  return html`

function AlertRow({ alert, onOpen, decision, setDecision, onConfirm, onDismiss, canDecide }) {
  const meta = STATUS_META[alert.status] || { label: alert.status, cls: "neutral" };
  const isOpen = decision && decision.id === alert.id;
  return html`
    <div className="panel fade-in" style=${{ padding: 13, borderLeft: "3px solid " + riskColorVar(alert.risk) }}>
      <div style=${{ display: "flex", gap: 12, alignItems: "flex-start" }}>
        <div style=${{
          width: 44, height: 44, borderRadius: 6, flexShrink: 0, position: "relative", overflow: "hidden",
          background: `linear-gradient(135deg, hsl(${alert.hue} 50% 18%), hsl(${alert.hue} 35% 8%))`,
          display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid var(--border-soft)",
        }}>
          ${ICN.alert({ size: 18, style: { color: "rgba(255,255,255,0.85)" } })}
        </div>
        <div style=${{ minWidth: 0, flex: 1 }}>
          <div style=${{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style=${{ fontSize: 13, fontWeight: 600 }}>${alert.type}</span>
            <${RiskBadge} risk=${alert.risk} />
            <span className=${"badge " + meta.cls}>${meta.label}</span>
            ${alert.strong && html`<span className="badge neutral" title="Score >= 2x threshold, or object-class signal">Strong Signal</span>`}
            ${alert.globalId && html`<span className="chip">${ICN.link({ size: 10 })} ${alert.globalId}</span>`}
          </div>
          <div style=${{ fontSize: 11, color: "var(--text-mid)", marginTop: 3 }}>${alert.cameraName} · ${alert.zone}</div>
          <div style=${{ fontSize: 10.5, color: "var(--text-low)", marginTop: 4 }} className="mono">
            ${alert.camera} · ${fmtDateTime(alert.timestamp)} · severity ${alert.severity}× · confidence ${alert.confidence}%
          </div>
          <${SignalChips} signals=${alert.signals} />
          ${alert.status === "DISMISSED" && alert.dismissReason && html`<div style=${{ fontSize: 11, color: "var(--text-low)", marginTop: 6 }}>Dismissed — ${alert.dismissReason}</div>`}
          ${alert.status === "CONFIRMED" && alert.dispatch && html`
            <div style=${{ fontSize: 11, color: "var(--safe)", marginTop: 6, display: "flex", alignItems: "center", gap: 5 }}>
              ${ICN.check({ size: 12 })} Dispatched to ${alert.dispatch.channels.join(", ")} · ${relTime(alert.dispatch.sentAt)}
            </div>
          `}
          ${alert.status === "SUPPRESSED_BY_BUDGET" && html`<div style=${{ fontSize: 11, color: "var(--medium)", marginTop: 6 }}>Held back — camera exceeded its hourly alert budget. Visible here in the digest.</div>`}
          <div style=${{ display: "flex", gap: 7, marginTop: 10, flexWrap: "wrap" }}>
            <button className="btn sm" onClick=${() => onOpen(alert.incidentId)}>${ICN.eye({ size: 12 })} Open</button>
            ${canDecide && (alert.status === "PENDING_CONFIRMATION" || alert.status === "SUPPRESSED_BY_BUDGET") && html`
              <button className="btn sm primary" onClick=${() => setDecision(isOpen && decision.mode === "confirm" ? null : { id: alert.id, mode: "confirm" })}>${ICN.send({ size: 12 })} Confirm and Notify</button>
              <button className="btn sm ghost" onClick=${() => setDecision(isOpen && decision.mode === "dismiss" ? null : { id: alert.id, mode: "dismiss" })}>${ICN.flag({ size: 12 })} Dismiss</button>
            `}
          </div>
          ${isOpen && decision.mode === "confirm" && html`<${ConfirmPanel} alert=${alert} onCancel=${() => setDecision(null)} onSend=${(channels) => { onConfirm(alert.id, channels); setDecision(null); }} />`}
          ${isOpen && decision.mode === "dismiss" && html`<${DismissPanel} onCancel=${() => setDecision(null)} onSend=${(reason, note) => { onDismiss(alert.id, reason, note); setDecision(null); }} />`}
        </div>
      </div>
    </div>
  `;
}

function AlertsPage({ alerts, tamperEvents, onOpen, onConfirm, onDismiss, role }) {
  const [tab, setTab] = useState("pending");
  const [decision, setDecision] = useState(null);
  const canDecide = can(role, "decide");

  const budgetToday = useMemo(() => {
    const today = alerts.filter((a) => Math.floor((Date.now() - a.timestamp) / 86400000) === 0);
    return { total: today.length, cap: RISK_ENGINE_DEFAULTS.alert_budget_per_hour * 24, suppressed: today.filter((a) => a.status === "SUPPRESSED_BY_BUDGET").length };
  }, [alerts]);

  const tabs = [
    { key: "pending", label: "Pending", filter: (a) => a.status === "PENDING_CONFIRMATION" },
    { key: "confirmed", label: "Confirmed", filter: (a) => a.status === "CONFIRMED" },
    { key: "dismissed", label: "Dismissed", filter: (a) => a.status === "DISMISSED" || a.status === "EXPIRED" },
    { key: "digest", label: "Digest", filter: (a) => a.status === "SUPPRESSED_BY_BUDGET" },
    { key: "system", label: "System", filter: null },
  ];

  const visible = tab === "system" ? [] : alerts.filter(tabs.find((t) => t.key === tab).filter).sort((a, b) => b.severity - a.severity || b.timestamp - a.timestamp);

  return html`
    <div className="fade-in">
      <div className="page-header">
        <div>
          <div className="page-title">Alert Center</div>
          <div className="page-sub">Risk-engine alerts, ranked by severity, subject to the per-camera hourly budget</div>
        </div>
        <div className="badge info" style=${{ fontSize: 11 }}>${budgetToday.total} alerts today · budget ${budgetToday.cap}/day · ${budgetToday.suppressed} in digest</div>
      </div>

      <div className="tabs-row" style=${{ marginBottom: 14 }}>
        ${tabs.map((t) => html`
          <div key=${t.key} className=${"tab-btn" + (tab === t.key ? " active" : "")} onClick=${() => setTab(t.key)}>
            ${t.label} ${t.key !== "system" && html`<span style=${{ color: "var(--text-low)" }}>(${alerts.filter(t.filter).length})</span>`}
          </div>
        `)}
      </div>

      ${tab === "system" && html`
        <div style=${{ display: "flex", flexDirection: "column", gap: 9 }}>
          ${tamperEvents.length === 0 && html`<div className="panel" style=${{ padding: 24, textAlign: "center", color: "var(--text-low)" }}>No tamper conditions reported.</div>`}
          ${tamperEvents.map((t) => html`
            <div key=${t.id} className="panel" style=${{ padding: 13, display: "flex", gap: 12, alignItems: "center", borderLeft: "3px solid " + (t.clearedAt ? "var(--text-low)" : "var(--critical)") }}>
              ${ICN.wifiOff({ size: 18, style: { color: t.clearedAt ? "var(--text-low)" : "var(--critical)" } })}
              <div style=${{ flex: 1 }}>
                <div style=${{ fontSize: 12.5, fontWeight: 600 }}>${t.cameraName} — view ${t.kind.toLowerCase()}</div>
                <div style=${{ fontSize: 10.5, color: "var(--text-low)" }} className="mono">${t.camera} · started ${fmtDateTime(t.startedAt)} ${t.clearedAt ? "· cleared " + fmtDateTime(t.clearedAt) : "· ongoing"}</div>
              </div>
              <span className=${"badge " + (t.clearedAt ? "neutral" : "critical")}>${t.clearedAt ? "Cleared" : "Active — bypasses budget"}</span>
            </div>
          `)}
        </div>
      `}

      ${tab !== "system" && visible.length === 0 && html`
        <div className="panel" style=${{ padding: 30, textAlign: "center", color: "var(--text-low)" }}>
          ${ICN.shield({ size: 22, style: { margin: "0 auto 10px", display: "block" } })}
          ${tab === "pending" ? "No alerts waiting. The system is watching." : "Nothing in this view."}
        </div>
      `}
      ${tab !== "system" && html`
        <div style=${{ display: "flex", flexDirection: "column", gap: 9 }}>
          ${visible.map((a) => html`
            <${AlertRow} key=${a.id} alert=${a} onOpen=${onOpen} decision=${decision} setDecision=${setDecision}
              onConfirm=${onConfirm} onDismiss=${onDismiss} canDecide=${canDecide} />
          `)}
        </div>
      `}
    </div>
  `;
}
// ===================== INCIDENT HISTORY PAGE =====================

function HistoryPage({ incidents, cameras, onOpen }) {
  const [query, setQuery] = useState("");
  const [risk, setRisk] = useState("all");
  const [status, setStatus] = useState("all");
  const [zone, setZone] = useState("all");
  const [dateRange, setDateRange] = useState("all");
  const [page, setPage] = useState(0);
  const pageSize = 12;

  const zones = useMemo(() => [...new Set(cameras.map((c) => c.zone))], [cameras]);

  const filtered = incidents.filter((inc) => {
    const q = query.trim().toLowerCase();
    const matchesQ = !q || inc.label.toLowerCase().includes(q) || inc.id.toLowerCase().includes(q) || inc.camera.toLowerCase().includes(q) || inc.cameraName.toLowerCase().includes(q);
    const matchesRisk = risk === "all" || inc.risk === risk;
    const matchesStatus = status === "all" || inc.status === status;
    const matchesZone = zone === "all" || inc.zone === zone;
    const days = Math.floor((Date.now() - inc.timestamp) / 86400000);
    const matchesDate = dateRange === "all" || (dateRange === "today" && days === 0) || (dateRange === "week" && days <= 7) || (dateRange === "twoweeks" && days <= 14);
    return matchesQ && matchesRisk && matchesStatus && matchesZone && matchesDate;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageItems = filtered.slice(page * pageSize, page * pageSize + pageSize);

  useEffect(() => { setPage(0); }, [query, risk, status, zone, dateRange]);

  return html`
    <div className="fade-in">
      <div className="page-header">
        <div>
          <div className="page-title">Incident History</div>
          <div className="page-sub">${filtered.length} of ${incidents.length} recorded events</div>
        </div>
      </div>

      <div className="panel" style=${{ padding: "10px 12px", marginBottom: 12, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        ${ICN.filter({ size: 14, style: { color: "var(--text-low)" } })}
        <input className="field" placeholder="Search…" value=${query} onInput=${(e) => setQuery(e.target.value)} style=${{ width: 180 }} />
        <select className="field" value=${risk} onChange=${(e) => setRisk(e.target.value)}>
          <option value="all">All Risk</option>
          <option value="critical">Critical</option><option value="high">High</option>
          <option value="medium">Medium</option><option value="low">Low</option>
        </select>
        <select className="field" value=${status} onChange=${(e) => setStatus(e.target.value)}>
          <option value="all">All Statuses</option>
          ${STATUSES.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
        </select>
        <select className="field" value=${zone} onChange=${(e) => setZone(e.target.value)}>
          <option value="all">All Zones</option>
          ${zones.map((z) => html`<option key=${z} value=${z}>${z}</option>`)}
        </select>
        <select className="field" value=${dateRange} onChange=${(e) => setDateRange(e.target.value)}>
          <option value="all">All Dates</option>
          <option value="today">Today</option>
          <option value="week">Last 7 Days</option>
          <option value="twoweeks">Last 14 Days</option>
        </select>
      </div>

      <div className="panel" style=${{ padding: 0, overflow: "hidden" }}>
        <div style=${{ overflowX: "auto" }}>
          <table className="data-table">
            <thead><tr>
              <th>Evidence</th><th>Incident</th><th>Camera</th><th>Zone</th><th>Timestamp</th><th>Confidence</th><th>Risk</th><th>Status</th>
            </tr></thead>
            <tbody>
              ${pageItems.map((inc) => html`
                <tr key=${inc.id} onClick=${() => onOpen(inc.id)}>
                  <td>
                    <div style=${{
                      width: 46, height: 30, borderRadius: 4,
                      background: `linear-gradient(135deg, hsl(${inc.hue} 50% 16%), hsl(${inc.hue} 35% 7%))`,
                      border: "1px solid var(--border-soft)", display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      <${TypeIcon} type=${inc.type} size=${13} style=${{ color: "rgba(255,255,255,0.75)" }} />
                    </div>
                  </td>
                  <td>
                    <div style=${{ fontWeight: 600 }}>${inc.label}</div>
                    <div className="mono" style=${{ fontSize: 10, color: "var(--text-low)" }}>${inc.id}</div>
                  </td>
                  <td className="mono">${inc.camera}</td>
                  <td>${inc.zone}</td>
                  <td className="mono">${fmtDateTime(inc.timestamp)}</td>
                  <td className="mono">${inc.confidence}%</td>
                  <td><${RiskBadge} risk=${inc.risk} /></td>
                  <td><span className="badge neutral">${inc.status}</span></td>
                </tr>
              `)}
              ${pageItems.length === 0 && html`<tr><td colSpan="8" style=${{ textAlign: "center", padding: 30, color: "var(--text-low)" }}>No incidents match the current filters.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", borderTop: "1px solid var(--border-soft)" }}>
          <span style=${{ fontSize: 11, color: "var(--text-low)" }}>Page ${page + 1} of ${totalPages}</span>
          <div style=${{ display: "flex", gap: 6 }}>
            <button className="btn sm" disabled=${page === 0} onClick=${() => setPage((p) => Math.max(0, p - 1))}>Previous</button>
            <button className="btn sm" disabled=${page >= totalPages - 1} onClick=${() => setPage((p) => Math.min(totalPages - 1, p + 1))}>Next</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function AnalyticsPage({ incidents, cameras }) {
  const trend = useMemo(() => last14DaysTrend(), []);
  const hours = useMemo(() => peakHours(), []);
  const categories = useMemo(() => CATEGORY_TOTALS.filter((c) => c.count > 0).sort((a, b) => b.count - a.count), []);
  const riskDist = useMemo(() => ({
    critical: incidents.filter((i) => i.risk === "critical").length,
    high: incidents.filter((i) => i.risk === "high").length,
    medium: incidents.filter((i) => i.risk === "medium").length,
    low: incidents.filter((i) => i.risk === "low").length,
  }), [incidents]);
  const falsePositiveRate = Math.round((incidents.filter((i) => i.status === "False Positive").length / incidents.length) * 100);
  const avgUptime = (cameras.reduce((s, c) => s + parseFloat(c.uptime), 0) / cameras.length).toFixed(2);
  const avgResolutionHrs = (rand(2.4, 6.8)).toFixed(1);

  return html`
    <div className="fade-in">
      <div className="page-header">
        <div>
          <div className="page-title">Analytics</div>
          <div className="page-sub">Operational metrics across detection performance, camera health and incident trends</div>
        </div>
      </div>

      <div className="kpi-grid">
        ${[
          ["False-Positive Rate", falsePositiveRate + "%", "var(--medium)"],
          ["Avg. Camera Uptime", avgUptime + "%", "var(--safe)"],
          ["Avg. Resolution Time", avgResolutionHrs + "h", "var(--info)"],
          ["Total Incidents (14d)", incidents.length, "var(--accent)"],
        ].map(([label, val, color]) => html`
          <div className="kpi-card" key=${label}>
            <div className="kpi-bar" style=${{ background: color }}></div>
            <div className="kpi-label">${label}</div>
            <div className="kpi-value">${val}</div>
          </div>
        `)}
      </div>

      <div className="grid-2col">
        <div className="panel">
          <div className="panel-title-row"><div className="panel-title">Incidents Over Time</div></div>
          <div className="panel-body">
            <${ChartCanvas} type="line" height="230px" data=${{
              labels: trend.map((d) => d.label),
              datasets: [{ label: "Incidents", data: trend.map((d) => d.total), borderColor: "#4C9EFF", backgroundColor: "rgba(76,158,255,0.08)", fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 }],
            }} options=${{ scales: { x: { grid: { display: false }, ticks: { color: "#626D80", font: { size: 10 } } }, y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#626D80", font: { size: 10 } } } } }} />
          </div>
        </div>
        <div className="panel">
          <div className="panel-title-row"><div className="panel-title">Risk Distribution</div></div>
          <div className="panel-body">
            <${ChartCanvas} type="doughnut" height="230px" data=${{
              labels: ["Critical", "High", "Medium", "Low"],
              datasets: [{ data: [riskDist.critical, riskDist.high, riskDist.medium, riskDist.low],
                backgroundColor: ["#E5484D", "#F0883E", "#E6C560", "#3DD68C"], borderColor: "#0B0E14", borderWidth: 2 }],
            }} options=${{ plugins: { legend: { display: true, position: "bottom", labels: { color: "#9AA5B6", boxWidth: 10, font: { size: 10.5 } } } }, cutout: "62%" }} />
          </div>
        </div>
      </div>

      <div className="grid-2col" style=${{ marginTop: 12 }}>
        <div className="panel">
          <div className="panel-title-row"><div className="panel-title">Event Categories</div></div>
          <div className="panel-body">
            <${ChartCanvas} type="bar" height="260px" data=${{
              labels: categories.map((c) => c.label),
              datasets: [{ data: categories.map((c) => c.count), backgroundColor: "#4C9EFF", borderRadius: 3, maxBarThickness: 22 }],
            }} options=${{
              indexAxis: "y",

            }} />
          </div>
        </div>
        <div className="panel">
          <div className="panel-title-row"><div className="panel-title">Peak Incident Hours</div></div>
          <div className="panel-body">
            <${ChartCanvas} type="bar" height="260px" data=${{
              labels: hours.map((_, i) => i + "h"),
              datasets: [{ data: hours, backgroundColor: "#4C9EFF88", borderRadius: 2, maxBarThickness: 14 }],
            }} options=${{ scales: { x: { grid: { display: false }, ticks: { color: "#626D80", font: { size: 9 } } }, y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#626D80", font: { size: 10 } } } } }} />
          </div>
        </div>
      </div>

      <div className="panel" style=${{ marginTop: 12 }}>
        <div className="panel-title-row"><div className="panel-title">Detection Confidence Distribution</div></div>
        <div className="panel-body">
          <${ChartCanvas} type="bar" height="200px" data=${{
            labels: CONFIDENCE_HISTOGRAM.map((_, i) => (i * 6.5).toFixed(0) + "%"),
            datasets: [{ data: CONFIDENCE_HISTOGRAM, backgroundColor: "#3DD68C99", borderRadius: 2, maxBarThickness: 26 }],
          }} options=${{ scales: { x: { grid: { display: false }, ticks: { color: "#626D80", font: { size: 9 } } }, y: { grid: { color: "rgba(255,255,255,0.04)" }, ticks: { color: "#626D80", font: { size: 10 } } } } }} />

function FieldRow({ label, hint, children }) {
  return html`
    <div style=${{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 16, alignItems: "start", padding: "10px 0", borderBottom: "1px solid var(--border-soft)" }}>
      <div>
        <div style=${{ fontSize: 12, fontWeight: 600 }}>${label}</div>
        ${hint && html`<div style=${{ fontSize: 10.5, color: "var(--text-low)", marginTop: 2 }}>${hint}</div>`}
      </div>
      <div>${children}</div>
    </div>
  `;
}

function NumberField({ value, onChange, step, min, max, suffix }) {
  return html`
    <div style=${{ display: "flex", alignItems: "center", gap: 8 }}>
      <input className="field" type="number" value=${value} step=${step || 1} min=${min} max=${max}
        onInput=${(e) => onChange(parseFloat(e.target.value))} style=${{ width: 100 }} />
      ${suffix && html`<span style=${{ fontSize: 11, color: "var(--text-low)" }}>${suffix}</span>`}
    </div>
  `;
}

function SaveBar({ onSave, saved }) {
  return html`
    <div style=${{ display: "flex", alignItems: "center", gap: 10, marginTop: 16 }}>
      <button className="btn primary" onClick=${onSave}>${ICN.check({ size: 13 })} Save Changes</button>
      ${saved && html`<span style=${{ fontSize: 11.5, color: "var(--safe)" }} className="fade-in">Saved — recorded in settings history and audit log.</span>`}
    </div>
  `;
}

function useSavedFlag() {
  const [saved, setSaved] = useState(false);
  function trigger() { setSaved(true); setTimeout(() => setSaved(false), 2600); }
  return [saved, trigger];
}

function RiskSettingsTab() {
  const [risk, setRisk] = useState({ ...SETTINGS_DEFAULTS.risk });
  const [saved, trigger] = useSavedFlag();
  function set(k) { return (v) => setRisk((prev) => ({ ...prev, [k]: v })); }
  return html`
    <div className="panel-body">
      <${FieldRow} label="Alert threshold (thr)" hint="Minimum decayed score to raise a candidate alert.">
        <${NumberField} value=${risk.thr} onChange=${set("thr")} />
      <//>
      <${FieldRow} label="Decay half-life (tau)" hint="Seconds; older signals contribute exponentially less.">
        <${NumberField} value=${risk.tau} onChange=${set("tau")} suffix="s" />
      <//>
      <${FieldRow} label="Alert budget per hour" hint="Per-camera cap before alerts are held in the digest.">
        <${NumberField} value=${risk.alert_budget_per_hour} onChange=${set("alert_budget_per_hour")} />
      <//>
      <${FieldRow} label="Cooldown" hint="Minimum time between alerts for the same entity.">
        <${NumberField} value=${risk.cooldown} onChange=${set("cooldown")} suffix="s" />
      <//>
      <${FieldRow} label="Minimum signal groups" hint="A single weak signal type never alerts alone.">
        <${NumberField} value=${risk.min_groups} onChange=${set("min_groups")} />
      <//>
      <${FieldRow} label="Diversity bonus" hint="Score multiplier per additional independent signal group.">
        <${NumberField} value=${risk.div_bonus} onChange=${set("div_bonus")} step="0.1" />
      <//>
      <${FieldRow} label="Loiter window / fraction" hint="loiter_s, loiter_frac">
        <div style=${{ display: "flex", gap: 10 }}>
          <${NumberField} value=${risk.loiter_s} onChange=${set("loiter_s")} suffix="s" />
          <${NumberField} value=${risk.loiter_frac} onChange=${set("loiter_frac")} step="0.1" />
        </div>
      <//>
      <${FieldRow} label="Running speed" hint="Box-heights per second.">
        <${NumberField} value=${risk.run_hps} onChange=${set("run_hps")} step="0.1" />
      <//>
      <${FieldRow} label="Unattended object" hint="stat_s (stationary) / away_s (owner absent)">
        <div style=${{ display: "flex", gap: 10 }}>
          <${NumberField} value=${risk.stat_s} onChange=${set("stat_s")} suffix="s" />
          <${NumberField} value=${risk.away_s} onChange=${set("away_s")} suffix="s" />
        </div>
      <//>
      <${FieldRow} label="Night multiplier" hint="Applied 22:00–06:00 local time.">
        <${NumberField} value=${risk.night_mult} onChange=${set("night_mult")} step="0.1" />
      <//>
      <${SaveBar} onSave=${trigger} saved=${saved} />
    </div>
  `;
}

function DetectionSettingsTab() {
  const [det, setDet] = useState({ ...SETTINGS_DEFAULTS.detection });
  const [saved, trigger] = useSavedFlag();
  const allClasses = ["person", "backpack", "handbag", "suitcase", "knife"];
  function toggleClass(c) {
    setDet((prev) => ({ ...prev, classes: prev.classes.includes(c) ? prev.classes.filter((x) => x !== c) : [...prev.classes, c] }));
  }
  return html`
    <div className="panel-body">
      <${FieldRow} label="Detected classes" hint="Kept object classes from the detector.">
        <div style=${{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          ${allClasses.map((c) => html`
            <span key=${c} onClick=${() => toggleClass(c)}

function TopologyGraph({ cameras, edges }) {
  const byId = useMemo(() => Object.fromEntries(cameras.map((c) => [c.id, c])), [cameras]);
  return html`
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style=${{ width: "100%", height: "100%", display: "block", background: "#080B10" }}>
      <defs>
        <pattern id="topogrid" width="5" height="5" patternUnits="userSpaceOnUse">
          <path d="M 5 0 L 0 0 0 5" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="0.15"/>
        </pattern>
      </defs>
      <rect width="100" height="100" fill="url(#topogrid)" />
      ${edges.map((e, i) => {
        const a = byId[e.from], b = byId[e.to];
        if (!a || !b) return null;
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        return html`
          <g key=${i}>
            <line x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y} stroke="rgba(76,158,255,0.35)" stroke-width="0.3" />
            <text x=${mx} y=${my} fontSize="1.9" fill="rgba(154,165,182,0.8)" fontFamily="JetBrains Mono">${e.meanS}±${e.stdS}s</text>
          </g>
        `;
      })}
      ${cameras.map((c) => html`
        <g key=${c.id} transform=${`translate(${c.x},${c.y})`}>
          <circle r="1.3" fill=${c.status === "offline" ? "#4A5568" : "#4C9EFF"} stroke="#05070A" stroke-width="0.4" />
          <text x="1.8" y="0.6" fontSize="2.2" fill="#E7ECF4" fontFamily="JetBrains Mono">${c.id}</text>
        </g>
      `)}
    </svg>
  `;
}
