            ${GHOSTS.map((g) => html`
              <div key=${g.id} style=${{ background: "var(--panel)", border: "1px solid var(--border-soft)", borderRadius: 7, padding: 11, marginBottom: 9 }}>
                <div style=${{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  ${ICN.ghost({ size: 14, style: { color: "var(--text-mid)" } })}
                  <span style=${{ fontSize: 12, fontWeight: 600 }}>${g.id}</span>
                  <span className="mono" style=${{ fontSize: 10, color: "var(--text-low)", marginLeft: "auto" }}>${relTime(g.exitedAt)}</span>
                </div>
                <div style=${{ fontSize: 10.5, color: "var(--text-low)", marginBottom: 8 }}>Exited ${g.exitCameraName}</div>
                <div style=${{ fontSize: 9.5, color: "var(--text-low)", textTransform: "uppercase", marginBottom: 6 }}>Belief — next camera</div>
                ${g.beliefs.map((b) => html`
                  <div key=${b.camera} style=${{ marginBottom: 5 }}>
                    <div style=${{ display: "flex", justifyContent: "space-between", fontSize: 10.5, marginBottom: 2 }}>
                      <span className="mono">${b.camera}</span><span className="mono">${Math.round(b.prob * 100)}%</span>
                    </div>
                    <div className="conf-bar-track"><div className="conf-bar-fill" style=${{ width: (b.prob * 100) + "%", background: "var(--info)" }}></div></div>
                  </div>
                `)}
              </div>
            `)}
          </div>
        </div>
      </div>

      <div className="panel" style=${{ marginTop: 12 }}>
        <div className="panel-title-row"><div className="panel-title">Linked Alerts (Global ID)</div></div>
        <div className="panel-body">
          ${(() => {
            const linked = {};
            ALERTS.forEach((a) => { if (a.globalId) { (linked[a.globalId] = linked[a.globalId] || []).push(a); } });
            const groups = Object.entries(linked);
            if (groups.length === 0) return html`<div style=${{ color: "var(--text-low)", fontSize: 12 }}>No cross-camera links yet.</div>`;
            return groups.slice(0, 6).map(([gid, items]) => html`
              <div key=${gid} style=${{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid var(--border-soft)" }}>
                <span className="chip">${ICN.link({ size: 10 })} ${gid}</span>
                ${items.map((a, i) => html`
                  <span key=${a.id} style=${{ fontSize: 11.5, color: "var(--text-mid)" }}>
                    ${i > 0 && html`<span style=${{ color: "var(--text-low)", margin: "0 6px" }}>→</span>`}${a.camera}
                  </span>
                `)}
                <span className="mono" style=${{ fontSize: 10, color: "var(--text-low)", marginLeft: "auto" }}>${items.length} cameras</span>
              </div>
            `);
          })()}
        </div>
      </div>
    </div>
  `;
}
// ===================== APP ROOT =====================

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Meridian runtime error:", error, info); }
  render() {
    if (this.state.error) {
      return html`
        <div style=${{
          height: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          gap: 12, background: "#05070A", color: "#9AA5B6", fontFamily: "Inter, sans-serif", padding: 24, textAlign: "center",
        }}>
          <div style=${{ fontSize: 15, fontWeight: 700, color: "#E7ECF4" }}>Meridian encountered an unexpected error</div>
          <div style=${{ fontSize: 12.5, maxWidth: 480 }}>${String(this.state.error && this.state.error.message || this.state.error)}</div>
          <button className="btn primary" onClick=${() => { this.setState({ error: null }); }} style=${{ marginTop: 8 }}>Reload Interface</button>
        </div>
      `;
    }
    return this.props.children;
  }
}

function App() {
  const [page, setPage] = useState("command");
  const [collapsed, setCollapsed] = useState(false);
  const [role, setRole] = useState("Admin");
  const [cameras] = useState(CAMERAS);
  const [incidents, setIncidents] = useState(INCIDENTS);
  const [alerts, setAlerts] = useState(ALERTS);
  const [tamperEvents] = useState(TAMPER_EVENTS);
  const [feed, setFeed] = useState(ACTIVITY_FEED_SEED);
  const [selectedCameraId, setSelectedCameraId] = useState(null);
  const [investigateId, setInvestigateId] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [notifications, setNotifications] = useState([
    { id: "n1", kind: "system", title: "System initialized", sub: "Meridian platform started successfully", timestamp: new Date(Date.now() - 3600000) },
    { id: "n2", kind: "camera", title: "CAM-014 went offline", sub: "Redgate Loading Dock — connection lost", timestamp: new Date(Date.now() - 1800000) },
  ]);

  // Global keyboard shortcut for command palette
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setSearchOpen(true); }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  // RBAC: if the current page becomes forbidden under a newly selected role, fall back to Command Center.
  useEffect(() => {
    const item = NAV_GROUPS.flatMap((g) => g.items).find((i) => i.key === page);
    if (item && item.perm && !can(role, item.perm)) setPage("command");
    // eslint-disable-next-line
  }, [role]);

  function pushToast(t) {
    const toast = { ...t, uid: Math.random().toString(36).slice(2) };
    setToasts((prev) => [toast, ...prev].slice(0, 4));
    setTimeout(() => setToasts((prev) => prev.filter((x) => x.uid !== toast.uid)), 5200);
  }

  function pushNotification(n) {
    setNotifications((prev) => [{ id: "n" + Math.random().toString(36).slice(2), timestamp: new Date(), ...n }, ...prev]);
  }

  function registerIncidents(newDetections) {
    setIncidents((prev) => {
      const existingIds = new Set(prev.map((i) => i.id));
      const fresh = newDetections.filter((d) => !existingIds.has(d.id));
      if (fresh.length === 0) return prev;
      return [...fresh, ...prev];
    });
    setFeed((prev) => {
      const existingIds = new Set(prev.map((f) => f.id));
      const freshFeed = newDetections.filter((d) => !existingIds.has(d.id)).map((d) => ({ id: d.id, text: d.label + " flagged in uploaded footage", timestamp: new Date(), risk: d.risk }));
      return [...freshFeed, ...prev].slice(0, 60);
    });
    setAlerts((prev) => {
      const existingIds = new Set(prev.map((a) => a.incidentId));
      const freshAlerts = newDetections
        .filter((d) => (d.risk === "critical" || d.risk === "high") && !existingIds.has(d.id))
        .map((d) => {
          const signals = deriveSignals(d);
          const groups = [...new Set(signals.map((s) => s.group))];
          const totalWeight = signals.reduce((s, x) => s + x.weight, 0);
          const severity = +(totalWeight / RISK_ENGINE_DEFAULTS.thr).toFixed(2);
          return {
            id: "ALT-" + d.id.split("-").slice(-1)[0], incidentId: d.id, type: d.label, camera: d.camera,
            cameraName: d.cameraName, zone: d.zone, timestamp: new Date(), risk: d.risk, confidence: d.confidence,
            hue: 205, signals, severity, strong: severity >= 2.0 || groups.includes("object"), groups,
            status: "PENDING_CONFIRMATION", dismissReason: null, dispatch: null, acknowledged: false,
            budgetIndex: 1, globalId: null,
          };
        });
      return [...freshAlerts, ...prev];
    });
  }

  function handleStatusChange(id, status) {
    setIncidents((prev) => prev.map((i) => i.id === id ? { ...i, status } : i));
  }

  function handleConfirm(alertId, channels) {
    setAlerts((prev) => prev.map((a) => a.id === alertId
      ? { ...a, status: "CONFIRMED", acknowledged: true, dismissReason: null, dispatch: { channels, status: "delivered", sentAt: new Date() } }
      : a));
    pushToast({ id: "confirm-" + alertId + "-" + Date.now(), title: "Alert confirmed", sub: `Notification sent to ${channels.length} channel(s).`, risk: "safe", timestamp: new Date() });
  }

  function handleDismiss(alertId, reason, note) {
    setAlerts((prev) => prev.map((a) => a.id === alertId ? { ...a, status: "DISMISSED", acknowledged: true, dismissReason: reason } : a));
    pushToast({ id: "dismiss-" + alertId + "-" + Date.now(), title: "Alert dismissed", sub: reason, risk: "neutral", timestamp: new Date() });
  }

  function openIncident(id) {
    setInvestigateId(id);
  }

  const baseIncident = incidents.find((i) => i.id === investigateId);
  const activeAlert = alerts.find((a) => a.incidentId === investigateId);
  const activeIncident = baseIncident ? (activeAlert ? {
    ...baseIncident,
    hasAlert: true,
    alertId: activeAlert.id,
    signals: activeAlert.signals,
    severity: activeAlert.severity,
    strong: activeAlert.strong,
    groups: activeAlert.groups,
    status: activeAlert.status,
    dismissReason: activeAlert.dismissReason,
    dispatch: activeAlert.dispatch,
    globalId: activeAlert.globalId,
  } : baseIncident) : null;

  const relatedForActive = activeIncident
    ? (activeIncident.globalId
        ? alerts.filter((a) => a.globalId === activeIncident.globalId && a.id !== activeIncident.alertId).map((a) => ({ id: a.id, label: a.type, timestamp: a.timestamp }))
        : incidents.filter((i) => i.camera === activeIncident.camera && i.id !== activeIncident.id))
    : [];

  const pendingAlerts = alerts.filter((a) => a.status === "PENDING_CONFIRMATION").length;

  let pageEl;
  if (page === "command") {
    pageEl = html`<${CommandCenterPage} cameras=${cameras} incidents=${incidents} alerts=${alerts} feed=${feed} tamperEvents=${tamperEvents} setPage=${setPage} onOpenIncident=${openIncident} />`;
  } else if (page === "analysis") {
    pageEl = html`<${VideoAnalysisPage} pushToast=${pushToast} pushNotification=${pushNotification} onOpenIncident=${openIncident} registerIncidents=${registerIncidents} />`;
  } else if (page === "incidents") {
    pageEl = html`<${IncidentsPage} incidents=${incidents} onOpen=${openIncident} onStatusChange=${handleStatusChange} />`;
  } else if (page === "map") {
    pageEl = html`<${CameraMapPage} cameras=${cameras} incidents=${incidents} selectedId=${selectedCameraId} setSelectedId=${setSelectedCameraId} />`;
  } else if (page === "gridview") {
    pageEl = html`<${CameraGridPage} cameras=${cameras} />`;
  } else if (page === "identity") {
    pageEl = html`<${IdentityTopologyPage} cameras=${cameras} role=${role} />`;
  } else if (page === "alerts") {
    pageEl = html`<${AlertsPage} alerts=${alerts} tamperEvents=${tamperEvents} onOpen=${openIncident} onConfirm=${handleConfirm} onDismiss=${handleDismiss} role=${role} />`;
  } else if (page === "history") {
    pageEl = html`<${HistoryPage} incidents=${incidents} cameras=${cameras} onOpen=${openIncident} />`;
  } else if (page === "analytics") {
    pageEl = html`<${AnalyticsPage} incidents=${incidents} cameras=${cameras} />`;
  } else if (page === "integrity") {
    pageEl = html`<${IntegrityAuditPage} pushToast=${pushToast} />`;
  } else if (page === "health") {
    pageEl = html`<${SystemHealthPage} cameras=${cameras} pushToast=${pushToast} />`;
  } else if (page === "settings") {
    pageEl = html`<${SettingsPage} pushToast=${pushToast} setPage=${setPage} />`;
  }

  const offlineCount = cameras.filter((c) => c.status === "offline").length;

  return html`
    <div className="app-shell">
      <${Sidebar} page=${page} setPage=${setPage} collapsed=${collapsed} setCollapsed=${setCollapsed} counts=${{ alerts: pendingAlerts }} role=${role} />
      <div className="main-col">
        <${Topbar} onOpenSearch=${() => setSearchOpen(true)} onOpenNotifications=${() => setNotifOpen(true)} notifCount=${notifications.length} role=${role} setRole=${setRole} />
        <${SystemBanner} tamperEvents=${tamperEvents} offlineCount=${offlineCount} />
        <div className="page-scroll">${pageEl}</div>
      </div>
      ${searchOpen && html`<${CommandPalette} onClose=${() => setSearchOpen(false)} onNavigate=${setPage} cameras=${cameras} incidents=${incidents} />`}
      ${notifOpen && html`<${NotificationDrawer} onClose=${() => setNotifOpen(false)} notifications=${notifications} />`}
      ${activeIncident && html`<${IncidentInvestigationModal} incident=${activeIncident} onClose=${() => setInvestigateId(null)} onStatusChange=${handleStatusChange} related=${relatedForActive} role=${role} onConfirm=${handleConfirm} onDismiss=${handleDismiss} />`}
      <${ToastStack} toasts=${toasts} />
    </div>
  `;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${ErrorBoundary}><${App} /><//>`);

</script>
</body>
</html>
